:root{--bg:#160E24;--card:#241535;--ink:#F6F1EA;--mute:#B7A8C6;--line:#3C2A55;--teal:#2EC9C0;--teal-dim:#1A8F8A;--orange:#FF7A1A;--orange-2:#FF9A4A;--brand:#2EC9C0;--brand2:#FF7A1A;--accent:#2A1B40;--warn:#E8A84A;--warnbg:#3A2A12;--ok:#3DCEA0;--okbg:#143328;--red:#E05A50;--redbg:#3A1616;--glow:0 0 6px rgba(46,201,192,.35),0 0 14px rgba(46,201,192,.25),0 0 28px rgba(46,201,192,.15);--glow-soft:0 0 8px rgba(46,201,192,.18)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:128px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Oswald,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:400;min-height:100%}
.iron{font-family:"Black Ops One",Oswald,system-ui,sans-serif;font-weight:400;text-shadow:var(--glow)}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:120px;background:var(--bg);z-index:7;pointer-events:none}
.brand-mark{position:fixed;top:10px;right:10px;z-index:8;display:flex;flex-direction:column;align-items:center;width:86px;pointer-events:none}
.brand-mark img{width:56px;height:auto;display:block;background:transparent;border:0;border-radius:0}
.brand-mark .alviss{margin-top:5px;font-family:Oswald,system-ui,sans-serif;font-weight:400;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(246,241,234,.88);line-height:1.1;text-shadow:none}
.brand-mark .aqg{font-family:"Black Ops One",Oswald,system-ui,sans-serif;font-weight:400;font-size:22px;letter-spacing:.06em;line-height:.95;color:var(--ink);text-shadow:var(--glow)}
main{max-width:760px;margin:0 auto;padding:128px 16px 130px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
h2{font-size:22px;margin:4px 0 10px}h3{font-size:17px;margin:14px 0 6px}
.page-title{font-family:"Black Ops One",Oswald,system-ui,sans-serif;font-weight:400;font-size:28px;text-align:center;letter-spacing:.06em;margin:0 0 18px;text-shadow:var(--glow)}
p{margin:6px 0}
.mute{color:var(--mute);font-size:14px}
button,.btn{font-family:"Black Ops One",Oswald,system-ui,sans-serif;font-weight:400;min-height:56px;padding:12px 18px;border-radius:14px;border:2px solid var(--teal);background:var(--card);color:var(--ink);cursor:pointer;touch-action:manipulation;text-shadow:var(--glow)}
button.primary{background:var(--orange);color:#1A0F28;border-color:var(--orange);text-shadow:none}
button.small{min-height:44px;padding:8px 16px;font-size:15px}
button.link{border:0;background:none;min-height:44px;text-decoration:underline;padding:8px;font-weight:400;color:var(--teal);font-family:Oswald,system-ui,sans-serif;text-shadow:none}
button:disabled{opacity:.45;cursor:not-allowed}
button.sel{background:var(--orange);border-color:var(--orange);color:#1A0F28;text-shadow:none}
button.danger{border-color:var(--red);color:var(--red);background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid button{padding:10px 6px;min-width:0;overflow-wrap:anywhere}
.grid.g3{grid-template-columns:repeat(3,1fr)}
@media(min-width:560px){.grid.g4{grid-template-columns:repeat(4,1fr)}}
input[type=text],select,textarea{font:inherit;font-family:Oswald,system-ui,sans-serif;width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:#1A102C;color:var(--ink);min-height:56px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(46,201,192,.45);border-color:var(--teal)}
#model{font-size:22px;font-weight:700;letter-spacing:.04em;text-align:center;padding:18px 12px;border-color:var(--teal);margin:0 auto;max-width:100%}
#ac{position:absolute;z-index:6;background:var(--card);border:2px solid var(--teal);border-radius:14px;box-shadow:0 0 18px rgba(46,201,192,.35),0 10px 26px rgba(0,0,0,.55);overflow:hidden;text-align:left;box-sizing:border-box}
#ac .ac-i{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px;padding:8px 14px;cursor:pointer;border-top:1px solid var(--line);color:var(--ink);font-family:Oswald,system-ui,sans-serif;font-size:15px;letter-spacing:.03em}
#ac .ac-i:first-child{border-top:0}
#ac .ac-i b{font-family:"Black Ops One",Oswald,system-ui,sans-serif;font-weight:400;font-size:16px;letter-spacing:.05em;text-shadow:var(--glow)}
#ac .ac-i small{color:var(--mute);font-size:12px;letter-spacing:.05em;text-transform:uppercase;text-align:right}
#ac .ac-i.ac-p{font-size:14px;color:var(--mute)}
#ac .ac-i.ac-p b{font-size:14px;color:var(--ink)}
#ac .ac-i.on,#ac .ac-i:hover{background:var(--orange);color:#1A0F28}
#ac .ac-i.on b,#ac .ac-i:hover b{text-shadow:none;color:#1A0F28}
#ac .ac-i.on small,#ac .ac-i:hover small,#ac .ac-i.ac-p.on{color:#1A0F28}
#otherdd{position:absolute;z-index:6;background:var(--card);border:2px solid var(--teal);border-radius:14px;box-shadow:0 0 18px rgba(46,201,192,.35),0 10px 26px rgba(0,0,0,.55);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;text-align:left;box-sizing:border-box}
#otherdd .ac-i{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px;padding:8px 14px;cursor:pointer;border-top:1px solid var(--line);color:var(--ink);font-family:Oswald,system-ui,sans-serif;font-size:15px;letter-spacing:.03em}
#otherdd .ac-i:first-child{border-top:0}
#otherdd .ac-i small{color:var(--mute);font-size:12px;letter-spacing:.05em;text-transform:uppercase;text-align:right}
#otherdd .ac-i.cur{color:var(--teal)}
#otherdd .ac-i.on,#otherdd .ac-i:hover{background:var(--orange);color:#1A0F28}
#otherdd .ac-i.on small,#otherdd .ac-i:hover small{color:#1A0F28}
#errcode{font-size:20px;font-weight:700;letter-spacing:.06em;text-align:center;padding:16px 12px;border-color:var(--teal);text-transform:uppercase}
label.l{display:block;font-weight:400;margin:18px 0 6px;font-size:15px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;font-family:Oswald,system-ui,sans-serif}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;background:var(--accent);color:var(--teal);margin:2px 4px 2px 0}
.chip.v{background:var(--okbg);color:var(--ok)}.chip.s{background:var(--warnbg);color:var(--warn)}
.ex button{min-height:44px;font-size:15px;padding:6px 12px;margin:4px 6px 0 0;border-width:1px}
.detect{border-left:6px solid var(--teal)}
.detect.none{border-left-color:var(--orange)}
.detect-line{margin:14px 0 0;font-size:15px;color:var(--mute);text-align:center;text-shadow:none}
.detect-line b{color:var(--teal);font-weight:700}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--teal)}
.q{font-size:23px;font-weight:700;line-height:1.3;margin:10px 0 6px}
.hint{color:var(--mute);font-size:15px;margin-bottom:8px}
.err-hint{color:var(--mute);font-size:15px;text-align:center;margin:0 0 10px;line-height:1.4;text-shadow:none;max-width:36em;margin-left:auto;margin-right:auto}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(22,14,36,.94);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:40;backdrop-filter:blur(8px)}
.foot:empty{display:none}
.foot>*{flex:0 0 auto;min-width:112px;max-width:180px}
.ins{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.ins input{width:28px;height:28px;flex:none;margin-top:2px}
.ins.on{background:var(--okbg);border-color:#3DCEA0}
.ins.key{border-color:var(--red);background:var(--redbg)}
.ins.key.on{background:var(--okbg);border-color:#3DCEA0}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.c{font-weight:700;white-space:nowrap;padding-right:12px}
.doc h3{border-bottom:2px solid var(--teal);padding-bottom:4px;margin-top:18px}
.doc dl{margin:0}.doc dt{font-weight:650;color:var(--mute);font-size:14px;margin-top:8px}.doc dd{margin:0 0 2px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#0C0814;color:#fff;padding:12px 18px;border-radius:12px;z-index:9;font-weight:600;border:1px solid var(--line)}
.note{background:var(--warnbg);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.legal{font-size:13px;color:var(--mute);margin-top:18px;text-align:center}
.items li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.items button{min-height:40px;padding:4px 12px;font-size:14px}
a{color:var(--teal)}
.nt{border-left:6px solid;border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--card);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:16px;text-shadow:none}
.nt b{display:block;font-size:13px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px}
.nt small{display:block;color:var(--mute);margin-top:4px;font-size:13px}
.nt.watch{border-left-color:#E05A50;background:#3A1616}.nt.watch b{color:#E05A50}
.nt.part{border-left-color:#C084FC;background:#2A1840}.nt.part b{color:#C084FC}
.nt.old{border-left-color:#5BA3E0;background:#15253A}.nt.old b{color:#5BA3E0}
.nt.other{border-left-color:#8A7A9A;background:#1E162C}.nt.other b{color:#B7A8C6}
.nt .vtag{display:inline-block;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:0 6px;font-size:11px;margin-left:6px;vertical-align:middle;letter-spacing:.04em}
.nt .src a,td .src a{color:var(--teal);margin-right:8px;font-size:13px}
.vtag{display:inline-block;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:0 6px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle;letter-spacing:.04em}
td .src{display:block;margin-top:3px}td .vnote{display:block;color:var(--mute);font-size:13px;margin-top:3px}
.nt .ex{display:inline-block;background:#0C0814;color:#fff;border-radius:6px;padding:0 6px;font-size:11px;margin-left:6px;vertical-align:middle}
details{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--card)}
details>summary{padding:12px 14px;font-weight:650;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:8px}
details>div{padding:0 14px 12px}
details details{margin-left:6px}
.cnt{background:var(--accent);color:var(--teal);border-radius:999px;padding:0 9px;font-size:13px;font-weight:700}
.cnt.n{background:var(--redbg);color:var(--red)}
@media print{body::before{display:none!important}header.top,.foot,.noprint,.toast,.brand-mark{display:none!important}body{background:#fff;color:#111;font-size:12pt;text-shadow:none}main{max-width:none;padding:0}.card{border:0;padding:0;margin:0;background:#fff}.doc dd{white-space:pre-wrap}}

.bubbles{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 18px;justify-content:center}
.bubbles button{min-height:52px;padding:12px 18px;border-radius:999px;border:2px solid var(--teal);background:transparent;color:var(--ink);font-family:"Black Ops One",Oswald,system-ui,sans-serif;font-weight:400;font-size:15px;cursor:pointer;text-shadow:var(--glow)}
.bubbles button.sel{background:var(--orange);border-color:var(--orange);color:#1A0F28;text-shadow:none}
.bubbles button .vtag{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:1px 6px;text-shadow:none;font-family:Oswald,system-ui,sans-serif}
.bubbles button.sel .vtag{background:rgba(26,15,40,.25);color:#1A0F28}
.bubbles button.code{border-style:dashed}
.s1{text-align:center}
.s1 .sec-lbl,.s2 .sec-lbl{text-align:center}
.s2 .bubbles{justify-content:center;margin:8px 0 22px}
.s2 .bubbles button{min-height:56px;padding:14px 20px;font-size:16px}
.s2 .err-block{max-width:520px;margin:8px auto 0;text-align:center}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.flags .chip.unk{background:var(--warnbg);color:var(--warn)}
.cause{background:var(--warnbg);border:2px solid var(--warn);border-radius:14px;padding:14px;margin:12px 0}
.cause h3{margin:0 0 6px}
.cause .by{color:var(--mute);font-size:13px;margin-top:6px}
.ph{border:2px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;background:var(--card)}
.ph h3{margin:4px 0 8px}
.ph .say{font-size:19px;font-weight:650;line-height:1.35;margin:8px 0;color:var(--ink)}
.ph .say b,.ph .why b{color:var(--teal);font-size:13px;letter-spacing:.03em;text-transform:uppercase;display:block;margin-bottom:4px;font-weight:700}
.ph .why{font-size:15px;margin:6px 0 12px;color:var(--mute)}
.ra{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--card)}
.ra .lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.ra .q{font-size:20px;font-weight:700;line-height:1.3;margin:6px 0 10px}
.sec-lbl{font-family:"Black Ops One",Oswald,system-ui,sans-serif;font-size:15px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:8px 0 12px;text-shadow:var(--glow)}
.model-lbl{display:block;font-family:"Black Ops One",Oswald,system-ui,sans-serif;font-weight:400;font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,241,234,.46);text-shadow:var(--glow);text-align:center;margin:22px 0 12px;line-height:1.15}
.tools{margin-top:28px;text-align:center}
.tools button.link{color:var(--mute);font-size:13px;opacity:.6;min-height:36px;text-decoration:none}
.tools button.link:hover{opacity:1;color:var(--teal)}
.qlist{list-style:none;margin:0;padding:0}
li.qitem.ra{display:flex;gap:14px;align-items:flex-start;padding:16px 4px;margin:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;text-shadow:none}
.qitem .num{flex:none;width:1.7em;color:var(--orange);font-family:"Black Ops One",Oswald,system-ui,sans-serif;font-weight:400;font-size:18px;line-height:1.45;text-align:right;text-shadow:var(--glow-soft)}
.qitem .qtxt{font-family:Oswald,system-ui,sans-serif;font-size:18px;font-weight:700;line-height:1.45;padding-top:1px;text-shadow:none}
li.qitem.photo .num{color:var(--teal)}
@media(min-width:700px){.qitem .qtxt{font-size:20px}.qitem,li.qitem.ra{padding:18px 6px}.model-lbl{font-size:32px}.page-title{font-size:32px}}
@media(max-width:420px){
  body::before{height:106px}
  html{scroll-padding-top:116px}
  .brand-mark{width:76px;top:8px;right:6px}
  .brand-mark img{width:48px}
  .brand-mark .aqg{font-size:18px}
  main{padding-top:118px;padding-left:14px;padding-right:14px}
  .bubbles button{min-height:48px;padding:10px 14px;font-size:14px}
  .s2 .bubbles button{min-height:52px;font-size:15px}
  #model{font-size:18px}
  .model-lbl{font-size:22px;letter-spacing:.1em}
  .page-title{font-size:22px}
}
</style>

        { types: ["dishwasher"], code: "C1", meaning: "Pump-out during drain exceeded 2 minutes. Clean the air gap, replace or reposition the hose, run the disposer. If it persists, service.", status: "verified", tier: "official", src: ["https://products.geappliances.com/appliance/gea-support-search-content?contentId=16673"] },
        { types: ["dishwasher"], code: "C2", meaning: "Total pump-out cycle exceeds 7 minutes. Press RESET to stop the beep.", status: "verified", tier: "official", src: ["https://products.geappliances.com/appliance/gea-support-search-content?contentId=16673"] },
        { types: ["dishwasher"], code: "C3", meaning: "Dishwasher will not drain. Breaker off about 30 seconds, then reset. If it persists, service.", status: "verified", tier: "official", src: ["https://products.geappliances.com/appliance/gea-support-search-content?contentId=16673"] },
        { types: ["dishwasher"], code: "C4", meaning: "Filled twice after a power failure. Float switch stuck or failed, or clogged drain or sump. Tap the float cover and check the sump for debris.", status: "verified", tier: "official", src: ["https://products.geappliances.com/appliance/gea-support-search-content?contentId=16673"] },

        { types: ["dishwasher"], code: "FTD / F56", meaning: "Failure to drain. Check the drain hose, air gap and disposer.", status: "verified", tier: "official", src: ["https://products.geappliances.com/appliance/gea-support-search-content?contentId=16673"] },
        { types: ["dishwasher"], code: "LEAK DETECTED", meaning: "Possible leak detected. The cycle is cancelled on models with leak detection. Contact service.", status: "verified", tier: "official", src: ["https://products.geappliances.com/appliance/gea-support-search-content?contentId=16673"] },
        { types: ["dishwasher"], code: "999", meaning: "Possible leak on models with Floor Protect with Alert (will not start, contact service). On other models the control needs a reset. GE's list of reset models: hold Cycle Select and Start for 5 seconds.", status: "verified", tier: "official", src: ["https://products.geappliances.com/appliance/gea-support-search-content?contentId=16673", "https://products.geappliances.com/appliance/gea-support-search-content?contentId=37645"] },
        { types: ["dishwasher"], code: "H2O", meaning: "Low water. Confirm the hot water valve under the sink is fully on, the unit is level and the inlet hose is not kinked. If H2O shows only on the 1-Hour Wash cycle, schedule service.", status: "verified", tier: "official", src: ["https://products.geappliances.com/appliance/gea-support-search-content?contentId=16673", "https://products.geappliances.com/appliance/gea-support-search-content?contentId=000060671"] },

        { types: ["dishwasher"], code: "iC0", meaning: "A problem was detected with the electronic control system. Press Cancel or turn power off at the breaker for 5 minutes. If it does not clear, service is needed.", status: "verified", tier: "official", src: ["https://frigidaire.bynder.com/asset/14e084d4-3f74-42aa-805e-e8042559529d/117859022en-pdf.pdf"] },
        { types: ["dishwasher"], code: "iF0", meaning: "Clogged filters or a restricted drain line. Clean both filters and the sump, check for a pinched or blocked drain hose, and remove the disposer knockout plug if one is attached.", status: "verified", tier: "official", src: ["https://frigidaire.bynder.com/asset/14e084d4-3f74-42aa-805e-e8042559529d/117859022en-pdf.pdf"], bubble: false },
        { types: ["dishwasher"], code: "CL / Cd", meaning: "Door is open or not latched. Close and latch it. If it will not close, service.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1829620-dishwasher-error-code-guide"] },
        { types: ["dishwasher"], code: "Hd / HO", meaning: "Heat Delay or Heater On mode. The unit is heating the water. Normal, about 1 to 2 minutes per degree of rise.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1829620-dishwasher-error-code-guide"] },
        { types: ["dishwasher"], code: "PF", meaning: "Loss of power. Press START/CANCEL to clear and start a new cycle. Frigidaire manual: a soft power failure pauses the cycle and resumes when power returns, a hard failure needs power restored and Start pressed within 18 hours.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1829620-dishwasher-error-code-guide", "https://frigidaire.bynder.com/asset/14e084d4-3f74-42aa-805e-e8042559529d/117859022en-pdf.pdf"] },
        { types: ["dishwasher"], code: "LOC", meaning: "Door is locked. Not a fault.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1829620-dishwasher-error-code-guide"], bubble: false },
        { types: ["dishwasher"], code: "01 to 24", meaning: "Delay option is on. The cycle starts when the time reaches 0. Not a fault.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1829620-dishwasher-error-code-guide"], bubble: false },
        { types: ["dishwasher"], code: "PRESS START", meaning: "Not an error. It scrolls to tell the user to close the door within 5 seconds of pressing Start.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1829620-dishwasher-error-code-guide"], bubble: false },
        { types: ["dishwasher"], code: "Close", meaning: "Not an error. The door was left open or is not latched. Latch it and the display clears.", status: "verified", tier: "official", src: ["https://frigidaire.bynder.com/asset/14e084d4-3f74-42aa-805e-e8042559529d/117859022en-pdf.pdf"], bubble: false },
        { types: ["dishwasher"], code: "i70", meaning: "Sources disagree. One repair reference says temperature sensor shorted or open, another says control board or communication fault. Not in Frigidaire's own dishwasher guides we saved.", status: "verify", tier: "third-party", src: ["https://theapplianceteam.com/error-codes/frigidaire-dishwasher/", "https://surefitapplianceservices.com/frigidaire-dishwasher-error-codes/"], bubble: false, note: "Two third-party sources that disagree. Confirm on the customer's model before relying on it." },
        { types: ["refrigerator"], code: "PF", meaning: "Power failure or surge. A high temp alarm can follow. Press Clear Alerts or Alarm Reset.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1847088-refrigerators-error-codes-and-alarms", "https://owner.frigidaire.com/support-articles/article/1853035-what-do-the-alarms-or-error-messages-mean-on-my-french-door-refrigerator-"] },
        { types: ["refrigerator"], code: "H / HI", meaning: "High temperature (blinking with a tone). Freezer at 26 F or warmer, or refrigerator at 55 F or warmer. Usually a door left open. Check the doors close and seal.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1847088-refrigerators-error-codes-and-alarms", "https://owner.frigidaire.com/support-articles/article/1853035-what-do-the-alarms-or-error-messages-mean-on-my-french-door-refrigerator-"] },
        { types: ["refrigerator"], code: "DI SP / DISP", meaning: "Ice jammed in the chute. Clear the jam, or empty and thaw the ice bin.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1847088-refrigerators-error-codes-and-alarms", "https://owner.frigidaire.com/support-articles/article/1853035-what-do-the-alarms-or-error-messages-mean-on-my-french-door-refrigerator-"] },
        { types: ["refrigerator"], code: "77 77", meaning: "Demo mode. Unplug for 5 minutes to clear.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1847088-refrigerators-error-codes-and-alarms"] },
        { types: ["refrigerator"], code: "SY CF / SY CE", meaning: "Communication problem between the user interface (display) and the main control board. SY CF is a failure at start up. SY CE is an error after a period of running. Frigidaire says these can mean authorized service is required. Tech sheets say check for pin back-outs and pinched or damaged wires before replacing parts.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1853035-what-do-the-alarms-or-error-messages-mean-on-my-french-door-refrigerator-", "https://s1.img-b.com/build.com/mediabase/specifications/frigidaire/950337/frigidaire-fghf2366pf-installation-34.pdf", "https://s1.img-b.com/build.com/mediabase/specifications/frigidaire/950345/frigidaire-fghs2631p-installation-74.pdf", "https://s1.img-b.com/build.com/mediabase/specifications/frigidaire/1219209/frigidaire-fgvu21f8q-specsheet-109.pdf"], note: "Meanings from Frigidaire service data sheets for FGHF2366PF, FGHS2631P and FGVU21F8Q. Confirm on the customer's model." },
        { types: ["refrigerator"], code: "SY EF", meaning: "Evaporator fan failure (Frigidaire service data sheets). Frigidaire's support page says it can mean authorized service is required.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1853035-what-do-the-alarms-or-error-messages-mean-on-my-french-door-refrigerator-", "https://s1.img-b.com/build.com/mediabase/specifications/frigidaire/950337/frigidaire-fghf2366pf-installation-34.pdf", "https://s1.img-b.com/build.com/mediabase/specifications/frigidaire/950345/frigidaire-fghs2631p-installation-74.pdf"], note: "Listed on two Frigidaire service data sheets (FGHF2366PF, FGHS2631P). Not on the FGVU21F8Q sheet." },
        { types: ["refrigerator"], code: "OP / SH", meaning: "A thermistor (temperature sensor) is open (OP) or shorted (SH). On the Frigidaire service data sheets the display position tells which sensor: freezer (FZ) or fresh food (FF). Frigidaire says these can mean authorized service is required.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1853035-what-do-the-alarms-or-error-messages-mean-on-my-french-door-refrigerator-", "https://s1.img-b.com/build.com/mediabase/specifications/frigidaire/950337/frigidaire-fghf2366pf-installation-34.pdf", "https://s1.img-b.com/build.com/mediabase/specifications/frigidaire/1219209/frigidaire-fgvu21f8q-specsheet-109.pdf"], note: "Meanings from Frigidaire service data sheets (FGHF2366PF, FGVU21F8Q). Confirm on the customer's model." },
        { types: ["refrigerator"], code: "SB / Sb", meaning: "Sabbath mode. Not a fault. Turn it off by holding the minus and Temp F-C buttons together for five seconds. The lights, dispenser and control panel do not work until it is off.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1847088-refrigerators-error-codes-and-alarms", "https://owner.frigidaire.com/support-articles/article/refrigerators-error-code-sb-sb-sabbath-mode", "https://owner.frigidaire.com/support-articles/article/1853035-what-do-the-alarms-or-error-messages-mean-on-my-french-door-refrigerator-"], bubble: false },
        { types: ["refrigerator"], code: "Door Ajar", meaning: "Door open 5 minutes or more. Close it and the alarm should stop.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1847088-refrigerators-error-codes-and-alarms", "https://owner.frigidaire.com/support-articles/article/1853035-what-do-the-alarms-or-error-messages-mean-on-my-french-door-refrigerator-"], bubble: false },
        { types: ["washer"], code: "E1", meaning: "Top load: water is not entering, or fills slowly. Check the lid, open both faucets fully, supply pressure, kinked hoses and clogged hose screens.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1829698-top-loading-washer-displaying-error-code-e1-long-fill-time"] },
        { types: ["washer"], code: "E2", meaning: "Top load: water takes too long to drain or is not draining. Check standpipe height, a kinked or clogged drain hose, and the fuse or breaker.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1829699-laundry-top-loading-washer-displaying-error-code-e2-water-takes-too-long-to-drain-"] },
        { types: ["washer"], code: "E3", meaning: "Top load: lid is open or the lid lock failed. Make sure the lid is closed and the unit is level. If it does not lock, the lid lock or board may have failed.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1829706-laundry-top-loading-washer-displaying-error-code-e3-washer-lid-open-or-lid-lock-failed-"] },
        { types: ["washer"], code: "E4", meaning: "Top load: out of balance during spin. Check leveling legs, that the foam shipping support was removed, and the load is balanced.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1830117-laundry-top-loading-washer-displaying-error-code-e4-washer-is-out-of-balance-"] },
        { types: ["washer"], code: "E5", meaning: "Top load: the unit is not level. Adjust the leveling legs.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1830380-laundry-top-loading-washer-displaying-error-code-e5-washer-is-not-level-"] },
        { types: ["washer"], code: "E11", meaning: "Front load: long fill, not filling during the wash phase. May lock the unit up to 6 minutes. Check hot and cold lines are not reversed and water supply requirements. The tech sheet says fill time too long: check faucets, hoses and inlet screens.", status: "verified", tier: "official", src: ["https://owner.electrolux.com/support-articles/article/1820068-laundry-front-loading-washer-displaying-error-code-e11-long-fill-time-", "https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf"], note: "One source is Electrolux-branded (owner.electrolux.com, Electrolux and Frigidaire share platforms). Also on the Frigidaire FAFW3577KA tech sheet." },
        { types: ["washer"], code: "E21", meaning: "Front load: long pump-out time. Check the drain hose for kinks, that hot and cold lines are not reversed, and the drain hose install. Sears also says check the house drain and drain hose for clogs, then the drain pump.", status: "verified", tier: "official", src: ["https://owner.electrolux.com/support-articles/article/1820072-laundry-front-loading-washer-displaying-error-code-e21-long-pump-out-time-", "https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], note: "One source is Electrolux-branded (owner.electrolux.com, Electrolux and Frigidaire share platforms). Also on the Frigidaire FAFW3577KA tech sheet." },
        { types: ["washer"], code: "F2", meaning: "Too many suds or suds overflowing. Use HE detergent, not too much, and run an empty Quick Wash to clean the unit.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1825280-laundry-front-loading-washer-displaying-error-code-f2-too-many-suds-or-suds-overflowing-"] },
        { types: ["washer"], code: "CL", meaning: "Top load: lid open more than 20 seconds with control lock on. Power off and turn off Control Lock.", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1831069-laundry-top-loading-washer-displaying-error-code-cl-lid-opened-more-than-20-seconds-with-control-lock-activated-"], bubble: false },
        { types: ["washer"], code: "E13", meaning: "Front load: water leak in the tub, or an air leak in the air bell or the water level pressure sensor air hose.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-front-load-washer/1428", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E23 / E24", meaning: "Front load: the drain pump relay on the control board failed (tech sheet also lists a wire off the pump or the pump). Service.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-front-load-washer/1428"], note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E31", meaning: "Front load: the water level pressure sensor is not communicating with the control board. Check the wiring between the sensor and control board; if good the sensor is usually the fault. Service.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-front-load-washer/1428", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E41", meaning: "Front load: the control thinks the door switch is open. Close the door firmly. If it persists, the door lock or its wiring needs service.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E43 / E48", meaning: "Front load: the control detects a problem with the door lock circuit. Check the harness between the door lock and control board, then the door lock, then the control board. Service.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-front-load-washer/1428", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E44 / E46", meaning: "Front load: control board problem. Unplug 5 minutes and restart. If it returns, the control board needs service.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-front-load-washer/1428"], note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "EF1", meaning: "Front load: clogged drain pump. Unclog the drain pump.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "EF2", meaning: "Too much soap. Advise the customer to reduce the amount of soap used.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], bubble: false, note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E35", meaning: "Front load: the pressure sensor shows water overfill. Check the inlet water valves are shutting off; if the washer is not really overfilling, the sensor may be at fault.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-front-load-washer/1428", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], bubble: false, note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E36 / E82 / E83 / EBE / EBF", meaning: "Front load: console control board problem. The tech sheet says to replace the console control board.", status: "verify", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf"], bubble: false, note: "Tech data sheet for FAFW3577KA only (model-specific) for the exact set. Confirm on the customer's model." },
        { types: ["washer"], code: "E38", meaning: "Front load: air chamber clogged or pressure sensor defective (tech sheet: check the air chamber, replace the pressure sensor).", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], bubble: false, note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E47", meaning: "Front load: the control thinks the door lock (PTC) circuit is open during spin.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], bubble: false, note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E52 / E59", meaning: "Front load: bad or missing drive motor tachometer (speed) signal. E52 is a bad signal, E59 is no signal for 3 seconds.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], bubble: false, note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E56 / E57 / E58", meaning: "Front load: high motor current (E56), high current on the inverter (E57), high current on a motor phase (E58).", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], bubble: false, note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E5A / E5B / E5C", meaning: "Front load: high temperature on the speed (motor) control board heat sink. E5A can be caused by overloading. Service.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], bubble: false, note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E5D / E5E / E5F", meaning: "Front load: communication problem between the console control board and the speed (motor) control board.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], bubble: false, note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E66 / E68", meaning: "Front load: heating element relay failure (E66), or current leakage to ground on the heater or a blown fuse (E68).", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], bubble: false, note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },
        { types: ["washer"], code: "E67", meaning: "Front load: incorrect input voltage to the microprocessor on the control board.", status: "verified", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf", "https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-digital-display-model-front-load-washer/1428"], bubble: false, note: "Tech data sheet for model FAFW3577KA (older Affinity front load) plus matching third-party code charts. Codes vary by model; confirm on the customer's washer." },

  noteKinds: { watch: "Watch out for", part: "Part unavailable / discontinued", old: "Unit getting old (repair vs replace)", other: "Other" },
  /* Knowledge base notes. scope: brand | bt (brand + type) | prefix | model. val is the prefix or model for those scopes.
     The two seeded notes are labeled EXAMPLE and contain no real facts. Users can hide them in the app. */
  notes: [
    { id: "ex1", scope: "bt", brand: "sub-zero", type: "refrigerator", kind: "watch", text: "EXAMPLE NOTE, not a real fact. A note of the type Watch out for, saved on a brand and type, shows here for every Sub-Zero refrigerator. Add your own with Add note.", date: "2026-11-10", by: "Example", ex: true },
    { id: "ex2", scope: "prefix", brand: "whirlpool", type: "refrigerator", val: "WRF", kind: "old", text: "EXAMPLE NOTE, not a real fact about WRF units. A note of the type Unit getting old, saved on a model prefix, shows for every model starting with it.", date: "2026-11-10", by: "Example", ex: true },
    /* Live intake 2026-11-10: notes below cite saved sources. status verify = third-party only or unconfirmed. */
    { id: "lv01", scope: "bt", brand: "ge", type: "washer", kind: "watch", text: "Front-load washer not draining, not spinning or stopping mid-cycle: GE says check for a kinked or crimped drain hose, a drain hose pushed too far down or taped to the standpipe (it can siphon water out), a clogged house drain (needs a plumber), a clogged pump filter (front bottom on most models), and an out-of-balance load.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://products.geappliances.com/appliance/gea-support-search-content?contentId=18538"] },
    { id: "lv02", scope: "bt", brand: "ge", type: "washer", kind: "watch", text: "GE says the H2O SUPPLY message is unrelated to options or cycles. It means a pressure sensor issue or closed supply valves, rarely very low pressure. If the water supply is confirmed on, GE recommends service.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://products.geappliances.com/appliance/gea-support-search-content?contentId=000060308"] },
    { id: "lv03", scope: "bt", brand: "whirlpool", type: "washer", kind: "watch", text: "Whirlpool drain and fill rules: no more than 4.5 in (113 mm) of drain hose in the standpipe, do not tape the hose in, standpipe at least 39 in (99 cm) high (the front-load page also gives 96 in maximum). Hot (red) hose to the hot valve. Anti-flood devices can reduce water pressure and flow.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://producthelp.whirlpool.com/Laundry/Washers/Top_Load_Washer/Error_Codes_or_Flashing_Lights/%22F%22_Codes/F8E1_-_Error_Code", "https://producthelp.whirlpool.com/Laundry/Washers/Product_Info/Washer_Product_Assistance/Error_Codes_in_Front_Load_Washers"] },
    { id: "lv04", scope: "bt", brand: "whirlpool", type: "washer", kind: "watch", text: "With F8 E1 the door may stay locked and the control may not respond. Whirlpool says press Power and wait about 10 minutes while the washer runs a drain routine.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://producthelp.whirlpool.com/Laundry/Washers/Product_Info/Washer_Product_Assistance/F8_E1_or_LF_or_LO_FL_Error_Code_in_Display"] },
    { id: "lv05", scope: "bt", brand: "whirlpool", type: "refrigerator", kind: "watch", text: "Whirlpool's refrigerator error pages list the F# E# codes but publish no separate meaning for each code. They give one reset (power off 1 minute, back on, cooling on, watch 1 minute). Do not tell the customer a specific cause from the code alone.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://producthelp.whirlpool.com/Refrigeration/Full-Size_Refrigerators/Bottom_Freezer_Refrigerator/Control_Usage_and_Idicator_Lights/Error_Codes"] },
    { id: "lv06", scope: "bt", brand: "frigidaire", type: "dishwasher", kind: "watch", text: "Frigidaire i20 check list: disposer knockout plug removed, drain hose not blocked or pinched and at least 32 in from the floor, filters and sump clear. Reset by Cancel, breaker off, or unplugging for 3 minutes.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1830367-dishwasher-error-code-i20-unit-did-not-drain-properly"] },
    { id: "lv07", scope: "bt", brand: "frigidaire", type: "refrigerator", kind: "watch", text: "Frigidaire high temp alarm triggers when the freezer reaches 26 F or the refrigerator reaches 55 F. Door Ajar sounds after 5 minutes open.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1853035-what-do-the-alarms-or-error-messages-mean-on-my-french-door-refrigerator-"] },
    { id: "lv08", scope: "bt", brand: "frigidaire", type: "refrigerator", kind: "other", text: "Where to find the model number (Frigidaire): top freezer, upper left side wall of the fresh food compartment. French door and side-by-side, upper right side of the fresh food compartment. Visible with the door open.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1858491-where-can-i-find-my-model-and-serial-number-"] },
    { id: "lv09", scope: "brand", brand: "frigidaire", kind: "other", text: "Frigidaire says that for units installed within the past 30 days, the customer should go back to the installer first. After 30 days, schedule service with Frigidaire.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1829699-laundry-top-loading-washer-displaying-error-code-e2-water-takes-too-long-to-drain-"] },
    { id: "lv10", scope: "bt", brand: "bosch", type: "washer", kind: "watch", text: "Bosch E17: about 2.5 gallons (10 L) per minute must flow from the fully open tap. The AquaStop hose has an electric valve, so it must not be put in water. Low pressure needs a plumber.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://www.bosch-home.com/us/en/c/spotlight/blt341dacb48f00c362/owner-support/error-codes/washers"] },
    { id: "lv11", scope: "bt", brand: "bosch", type: "washer", kind: "other", text: "Bosch 'all other fault codes': switch off and on. If it shows again, disconnect power for at least 30 seconds and reconnect. If it was a one-off, the message goes away.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://www.bosch-home.com/us/en/c/spotlight/blt341dacb48f00c362/owner-support/error-codes/washers"] },
    { id: "lv12", scope: "bt", brand: "bosch", type: "dishwasher", kind: "watch", text: "PartSelect (third-party) on Bosch dishwasher not draining: some models have a check valve in the drain pump with a piston and nut assembly, some a check valve flapper at the drain outlet. Most have one motor pump with a circulation and a drain impeller, and some older models have a belt-driven pump.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verify", tier: "third-party", src: ["https://www.partselect.com/Repair/Dishwasher/Bosch/Not-Draining/"] },
    { id: "lv13", scope: "bt", brand: "bosch", type: "dishwasher", kind: "other", text: "PartSelect (third-party) points to checking: leaking, pump and door seals and the water inlet valve. Won't fill, inlet valve, float switch, door switch. Not drying, heating element, high limit thermostat, rinse aid dispenser. Won't dispense detergent, bi-metal release, wax motor, timer. Not cleaning, housing gaskets, spray arms, delivery tubes, filters. Won't start, door latch switches, timer, electronic controls, motor relays, thermal fuses.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verify", tier: "third-party", src: ["https://www.partselect.com/Repair/Dishwasher/Bosch/"] },
    { id: "lv14", scope: "bt", brand: "frigidaire", type: "refrigerator", kind: "other", text: "AppliancePartsPros (third-party) lists these as common Frigidaire refrigerator complaints: water or ice dispenser not working, ice maker not working or overflowing, defrost drain clogged, freezer cold but refrigerator warm, door not closing, frost or moisture around the door.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verify", tier: "third-party", src: ["https://www.appliancepartspros.com/repair-help/frigidaire-refrigerator-repair-help"] },
    { id: "lv15", scope: "bt", brand: "frigidaire", type: "washer", kind: "other", text: "AppliancePartsPros (third-party) lists these as common Frigidaire washer complaints: fills slowly or not at all, and filling when not in use.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verify", tier: "third-party", src: ["https://www.appliancepartspros.com/repair-help/frigidaire-washer-repair-help"] },
    { id: "lv16", scope: "bt", brand: "whirlpool", type: "washer", kind: "other", text: "appliancefixva.com (third-party, single site): older Whirlpool Duet front-loaders used two-digit codes for the same problems, for example F21 for long drain, and F02 on some models.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verify", tier: "third-party", src: ["https://appliancefixva.com/blog/washer/whirlpool-washer-error-codes"] },
    { id: "lv17", scope: "bt", brand: "frigidaire", type: "washer", kind: "other", text: "Sears PartsDirect (third-party, single site): on Frigidaire front-load washers without a digital display, the row of 5 status lights blinks the first digit of the code, and the Start light blinks the second digit. For a letter in the third position, the Start light blinks 10 times for A, 11 for B, 12 for C and so on.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verify", tier: "third-party", src: ["https://www.searspartsdirect.com/diy/error-codes/washer-repair/1234598/frigidaire-front-load-washer/1428"] },
    { id: "lv18", scope: "bt", brand: "frigidaire", type: "dishwasher", kind: "watch", text: "Frigidaire says for any dishwasher error code: press Cancel or turn power off at the breaker for 5 minutes. If that does not clear it, contact Frigidaire Customer Care (1-800-944-9044 in the manual). Codes i20, i40 and iF0 point to clogged filters or a restricted drain line. i10 is a low fill (pinched supply line or shutoff not fully open). i30 is water in the bottom pan.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://frigidaire.bynder.com/asset/14e084d4-3f74-42aa-805e-e8042559529d/117859022en-pdf.pdf"] },
    { id: "lv19", scope: "bt", brand: "frigidaire", type: "dishwasher", kind: "watch", text: "Frigidaire dishwasher water leaking check list: newly installed unit, drain hose installed correctly and not blocked; new disposer, knockout plug removed; supply hose connections secure and not kinked; filter and glass trap clean; only dishwasher detergent (hand soap causes over-sudsing), not too much, and no spilled rinse aid.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/1838717-dishwasher-water-leaking"] },
    { id: "lv20", scope: "bt", brand: "frigidaire", type: "dishwasher", kind: "other", text: "One repair shop (SureFit, third-party, single source) describes i40 as a temperature sensor fault and i70 as a control board fault. Frigidaire's own pages say i40 is a clogged filter or sump. Trust Frigidaire for i40 and verify i70 on the model.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verify", tier: "third-party", src: ["https://surefitapplianceservices.com/frigidaire-dishwasher-error-codes/"] },
    { id: "lv21", scope: "bt", brand: "frigidaire", type: "refrigerator", kind: "watch", text: "Frigidaire Sabbath mode (Sb): turned on and off by holding the minus and Temp F-C buttons together for five seconds. While on, the lights, dispenser and control panel do not work, and it stays on after a power failure. The High Temp alarm still works in Sabbath mode.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://owner.frigidaire.com/support-articles/article/refrigerators-error-code-sb-sb-sabbath-mode"] },
    { id: "lv22", scope: "bt", brand: "frigidaire", type: "refrigerator", kind: "watch", text: "Frigidaire service data sheets (FGHF2366PF, FGHS2631P, FGVU21F8Q): for OP, SH and SY codes, always check for pin back-outs and pinched or damaged wires before replacing parts, and decide whether the fault is the part, the main control board or the wiring. In the thermistor codes, the display position tells which sensor (freezer or fresh food).", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verified", tier: "official", src: ["https://s1.img-b.com/build.com/mediabase/specifications/frigidaire/950337/frigidaire-fghf2366pf-installation-34.pdf", "https://s1.img-b.com/build.com/mediabase/specifications/frigidaire/950345/frigidaire-fghs2631p-installation-74.pdf"] },
    { id: "lv23", scope: "bt", brand: "frigidaire", type: "washer", kind: "other", text: "Frigidaire front load washer without a code display (tech data sheet FAFW3577KA, model-specific): wake the washer, wait 5 seconds, then press and hold Start/Pause and Cancel together. While held, the code shows as E plus two characters and the Door Lock, Wash, Rinse and Final Spin lights flash. Normal messages: cd cool down, do or dr door problem, LOC control lock, PAU cycle paused.", date: "2026-11-10", by: "Live intake 2026-11-10", status: "verify", tier: "official", src: ["https://www.canadianappliance.ca/pdf/frigidaire/laveuses/FAFW3577KA-schema-de-cablage-all-languages-canada.pdf"] }
  ],

        { q: "What happens when they try to use it: nothing at all, a click or hum, lights but no run, or it starts and stops?", kind: "text" },

function detect(m){
  var n=norm(m);if(!n)return null;
  for(var i=0;i<user.memory.length;i++){if(user.memory[i].m===n)return{b:user.memory[i].b,t:user.memory[i].t,how:"remembered",p:n,s:"user"}}

  return best?{b:best.b,t:best.t,how:"prefix",p:norm(best.p),s:best.s,src:best.src}:{none:true};
}

function matchSymptoms(raw){
  var t=normText(raw);if(!t)return[];
  var pad=" "+t+" ",hits=[],seen={};
  allSymptoms().forEach(function(sy){
    var aliases=[sy.id,sy.label].concat(sy.aliases||[]);
    for(var i=0;i<aliases.length;i++){
      var a=normText(aliases[i]);if(!a)continue;
      if(t===a||pad.indexOf(" "+a+" ")>-1){if(!seen[sy.id]){hits.push(sy);seen[sy.id]=1}break}
    }

function classify(raw){
  var d=detect(raw),sy=matchSymptoms(raw),modelHit=d&&!d.none;

function codeId(code){return String(code||"").split("/")[0].trim()}
function flagsFor(b,t,model){
  var n=norm(model),defs=D.flagDefs||{},out={};
  Object.keys(defs).forEach(function(k){out[k]={value:"unknown",sources:[],scope:null,rank:-1}});
  allFeatFlags().forEach(function(rec){
    var rank=-1;
    if(rec.scope==="model"&&n&&norm(rec.val)===n)rank=300;
    else if(rec.scope==="prefix"&&n&&rec.val&&n.indexOf(norm(rec.val))===0)rank=200+norm(rec.val).length;
    else if(rec.scope==="bt"&&rec.brand===b&&rec.type===t)rank=100;
    else if(rec.scope==="brand"&&rec.brand===b)rank=50;
    if(rank<0)return;
    Object.keys(rec.flags||{}).forEach(function(k){
      var cur=out[k]||{value:"unknown",sources:[],rank:-1};
      if(rank>=(cur.rank||-1)){

      }

}
function bubblesFor(b,t,model){
  var flags=flagsFor(b,t,model),list=[],seen={};

    if(!bb||!bb.id||seen[bb.id])return;

    if(fl&&flags[fl]&&flags[fl].value==="no")return;
    var verify=fl?(!flags[fl]||flags[fl].value!=="yes"):!!bb.verify;
    seen[bb.id]=1;
    list.push({id:bb.id,label:bb.label||bb.id,kind:bb.kind||"symptom",meaning:bb.meaning||"",flag:fl||"",verify:verify,status:bb.status||"starter"});
  }
  ((D.typeBubbles||{})[t]||[]).forEach(function(id){var sy=symptomById(id);add({id:id,label:sy?sy.label:id,kind:"symptom"})});
  (D.brandBubbles||[]).concat(user.bubbles||[]).forEach(function(bb){
    if(bb.brand&&bb.brand!==b)return;
    if(bb.type&&bb.type!==t)return;
    if(bb.scope==="prefix"&&(!model||norm(model).indexOf(norm(bb.val||""))!==0))return;
    if(bb.scope==="model"&&norm(model)!==norm(bb.val||""))return;

function matchRules(b,t,picks,flags){
  picks=picks||[];
  var set={};picks.forEach(function(id){set[id]=1});
  return allBranchRules().filter(function(r){
    if(r.brand&&r.brand!==b)return false;
    if(r.type&&r.type!==t)return false;
    var all=r.all||[],none=r.none||[],i;
    for(i=0;i<all.length;i++)if(!set[all[i]])return false;
    for(i=0;i<none.length;i++)if(set[none[i]])return false;
    if(r.flag&&flags&&flags[r.flag]&&flags[r.flag].value==="no")return false;
    return true;
  });
}
function photosFor(b,t,picks,rules){
  var list=[],seen={},sySet={};
  (picks||[]).forEach(function(id){sySet[id]=1});
  function add(p){if(p&&p.id&&!seen[p.id]){seen[p.id]=1;list.push(p)}}
  var hasLeak=!!sySet.leaking;
  var hasCode=(picks||[]).some(function(id){return id==="flashing-lights"||!symptomById(id)});
  allPhotos().forEach(function(p){
    if(p.scope==="rule")return;
    if(p.when==="leak"){if(hasLeak)add(p);return}
    if(p.when==="code"){if(hasCode)add(p);return}
    if((p.scope||"general")==="general"&&!p.when)add(p);
    else if(p.scope==="type"&&p.type===t)add(p);
    else if(p.scope==="brand"&&p.brand===b)add(p);
    else if(p.scope==="bt"&&p.brand===b&&p.type===t)add(p);
    else if(p.scope==="symptom"&&sySet[p.target])add(p);
  });

function errorCodeHint(brand,type){

  if(!codes.length)return generic;

  function leadTok(tok){var x=String(tok||"").trim();var m=x.match(/^([A-Za-z]+|\d+)/);return m?m[1]:""}

    var tkeys=Object.keys(byType).filter(function(k){return k!=="_"});
    if(tkeys.length>1){
      function sig(list){var s=[],seen={};list.forEach(function(c){var p=leadTok(partsOf(c)[0]||"");if(p&&!seen[p]){seen[p]=1;s.push(p)}});s.sort();return s.join("|")}
      var sigs=tkeys.map(function(tp){return sig(byType[tp])});
      if(!sigs.every(function(x){return x===sigs[0]}))return "Error codes for this "+bl(brand)+" vary by appliance type. "+generic;
    }
  }
  var prefixSet={},wholeSet={},alts=[],seenA={};
  codes.forEach(function(c){
    var parts=partsOf(c);if(!parts.length)return;
    var first=parts[0],p=leadTok(first);
    if(p){if(first.length>p.length)prefixSet[p]=1;else wholeSet[first]=1}
    parts.slice(1).forEach(function(part){if(part&&!prefixSet[leadTok(part)]&&!seenA[part]){seenA[part]=1;alts.push(part)}})
  });
  Object.keys(prefixSet).forEach(function(p){delete wholeSet[p]});
  var types={};codes.forEach(function(c){(c.types||[]).forEach(function(tp){types[tp]=1})});
  var tkeys=Object.keys(types),typelabel="";

  else if(tkeys.length===2)typelabel=" "+tl(tkeys[0]).toLowerCase()+" or "+tl(tkeys[1]).toLowerCase();
  var prefixes=Object.keys(prefixSet);
  var nums=prefixes.filter(function(p){return /^\d+$/.test(p)}).concat(Object.keys(wholeSet).filter(function(p){return /^\d+$/.test(p)}));
  var letters=prefixes.filter(function(p){return !/^\d+$/.test(p)});

  else if(letters.length)clause="generally start with "+joinOr(letters);
  else if(extras.length){clause="may show "+joinOr(extras);extras=[]}
  else return generic;

}
